{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "automation-platform.namespace" . }}
  labels:
{{- include "automation-platform.labels" . | nindent 4 }}
{{- with .Values.namespace.labels }}
{{- toYaml . | nindent 4 }}
{{- end }}
  annotations:
{{- include "automation-platform.annotations" . | nindent 4 }}
{{- with .Values.namespace.annotations }}
{{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
